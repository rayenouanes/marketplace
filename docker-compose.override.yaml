services:
  postgres-dwh:
    image: postgres:18
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DWH_PASSWORD}
      POSTGRES_DB: marketplace
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-dwh-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pg-dwh-data:
  minio-data:
